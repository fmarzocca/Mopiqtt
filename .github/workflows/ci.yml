name: CI

on:
  push:
    branches:
      - Development
      - main
  pull_request:
    branches:
      - Development
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff
        run: python -m ruff check mopiqtt tests setup.py

      - name: Check changed files for whitespace errors
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" HEAD
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            git diff --check "$(git rev-list --max-parents=0 HEAD)" HEAD
          else
            git diff --check "$BEFORE" HEAD
          fi

  mopidy3-compat:
    name: Mopidy 3.4 / Python 3.13 (legacy)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libcairo2-dev libgirepository-2.0-dev pkg-config

      - name: Install Mopidy 3 and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<82" "Mopidy==3.4.2" "PyGObject>=3.50" pytest
          python -m pip install --editable .

      - name: Show installed versions
        run: python -c "from importlib.metadata import version; print('Mopidy', version('Mopidy')); print('Setuptools', version('setuptools'))"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile package
        run: |
          python -m compileall -q mopiqtt
          python -m py_compile mopiqtt/*.py

  mopidy4-current:
    name: Mopidy 4.0 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libcairo2-dev libgirepository-2.0-dev pkg-config

      - name: Install Mopidy 4 and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Mopidy==4.0.1" pytest
          python -m pip install --editable .

      - name: Show installed version
        run: python -c "import mopidy; print('Mopidy', mopidy.__version__)"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile package
        run: |
          python -m compileall -q mopiqtt
          python -m py_compile mopiqtt/*.py
